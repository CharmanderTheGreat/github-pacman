name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build dir
        run: mkdir -p dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Pacman Contribution Graph (dark theme)
        run: npx pacman-contribution-graph --platform github --username CharmanderTheGreat --gameTheme github-dark --output dist/pacman-contribution-graph.svg
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Publish Pacman Graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
